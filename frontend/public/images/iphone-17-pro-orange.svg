<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="40%" stop-color="#E85D1A" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="frameGradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="cameraIslandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0.9" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <radialGradient id="lensGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Shadow & Phone Outer Frame -->
  <rect x="70" y="40" width="260" height="520" rx="46" fill="url(#frameGradOrange)" filter="url(#phoneShadow)" />
  <!-- Phone Inner Back Glass -->
  <rect x="74" y="44" width="252" height="512" rx="42" fill="url(#bodyGradOrange)" />

  <!-- Subtle Specular Sheen -->
  <path d="M 74,86 C 160,86 280,180 326,300 L 326,44 L 116,44 Z" fill="white" opacity="0.12" />

  <!-- Camera Plateau / Island -->
  <rect x="92" y="64" width="136" height="142" rx="28" fill="url(#cameraIslandOrange)" stroke="#FB923C" stroke-width="1.5" />

  <!-- Lens 1 (Top Left) -->
  <circle cx="128" cy="100" r="24" fill="#1E293B" stroke="#FED7AA" stroke-width="2.5" />
  <circle cx="128" cy="100" r="17" fill="url(#lensGrad1)" />
  <circle cx="122" cy="94" r="5" fill="#38BDF8" opacity="0.6" />

  <!-- Lens 2 (Bottom Left) -->
  <circle cx="128" cy="170" r="24" fill="#1E293B" stroke="#FED7AA" stroke-width="2.5" />
  <circle cx="128" cy="170" r="17" fill="url(#lensGrad1)" />
  <circle cx="122" cy="164" r="5" fill="#38BDF8" opacity="0.6" />

  <!-- Lens 3 (Right Middle) -->
  <circle cx="192" cy="135" r="24" fill="#1E293B" stroke="#FED7AA" stroke-width="2.5" />
  <circle cx="192" cy="135" r="17" fill="url(#lensGrad1)" />
  <circle cx="186" cy="129" r="5" fill="#38BDF8" opacity="0.6" />

  <!-- TrueTone Flash & LiDAR Sensor -->
  <circle cx="192" cy="85" r="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
  <circle cx="192" cy="182" r="6" fill="#0F172A" />

  <!-- Apple Brand Mark / Subtle Logo -->
  <circle cx="200" cy="305" r="18" fill="white" opacity="0.25" />
  <circle cx="208" cy="300" r="14" fill="url(#bodyGradOrange)" />
  <ellipse cx="200" cy="282" rx="4" ry="7" fill="white" opacity="0.25" transform="rotate(30 200 282)" />
</svg>
