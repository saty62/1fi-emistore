<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="s24BodyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="50%" stop-color="#1E2127" />
      <stop offset="100%" stop-color="#14161A" />
    </linearGradient>
    <linearGradient id="s24FrameBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <filter id="s24Shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Phone Boxy Frame with subtle 12px corners -->
  <rect x="70" y="40" width="260" height="520" rx="14" fill="url(#s24FrameBlack)" filter="url(#s24Shadow)" />
  <rect x="74" y="44" width="252" height="512" rx="10" fill="url(#s24BodyBlack)" />

  <!-- Specular Reflection -->
  <path d="M 74,44 L 200,44 L 326,260 L 326,556 Z" fill="white" opacity="0.04" />

  <!-- Samsung Floating Camera Lenses (Vertical Column) -->
  <!-- Main Lens 1 -->
  <circle cx="118" cy="100" r="22" fill="#0F172A" stroke="#475569" stroke-width="3" />
  <circle cx="118" cy="100" r="14" fill="#020617" />
  <circle cx="113" cy="95" r="4" fill="#38BDF8" opacity="0.6" />

  <!-- Main Lens 2 -->
  <circle cx="118" cy="165" r="22" fill="#0F172A" stroke="#475569" stroke-width="3" />
  <circle cx="118" cy="165" r="14" fill="#020617" />
  <circle cx="113" cy="160" r="4" fill="#38BDF8" opacity="0.6" />

  <!-- Main Lens 3 (Periscope Telephoto) -->
  <circle cx="118" cy="230" r="22" fill="#0F172A" stroke="#475569" stroke-width="3" />
  <circle cx="118" cy="230" r="14" fill="#020617" />
  <rect x="110" y="222" width="16" height="16" rx="3" fill="#1E293B" stroke="#0284C7" stroke-width="1" />

  <!-- Right Sensor Column -->
  <circle cx="168" cy="100" r="12" fill="#0F172A" stroke="#475569" stroke-width="2" />
  <circle cx="168" cy="100" r="6" fill="#DC2626" opacity="0.6" />

  <!-- Laser AF / Flash -->
  <circle cx="168" cy="140" r="8" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />

  <!-- Telephoto 3x -->
  <circle cx="168" cy="180" r="14" fill="#0F172A" stroke="#475569" stroke-width="2.5" />
  <circle cx="168" cy="180" r="8" fill="#020617" />

  <!-- Brand Wordmark -->
  <text x="200" y="520" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="white" opacity="0.3">SAMSUNG</text>
</svg>
